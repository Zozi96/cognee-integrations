name: cognee
kind: exclusive
version: 1.2.2
description: "Cognee memory provider for Hermes Agent: session-aware graph memory, recall, forget, and session-end improvement."
pip_dependencies:
  # Exact pin: the installed package doubles as the local server this plugin
  # spawns, and 1.5.4 is both the floor — code-graph indexing moved its
  # repo-spec form field to raw_data there; content_type="code", the "code"
  # recall scope and targeted session invalidation on document delete first
  # shipped in 1.5.3 — and the newest version verified against the test suite
  # and a live server.
  - cognee==1.5.4
hooks:
  - on_session_end
  - on_memory_write
